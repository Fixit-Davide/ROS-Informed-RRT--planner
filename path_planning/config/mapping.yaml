octomap_server:
  ros__parameters:
    resolution: 0.20
    frame_id: map
    sensor_model:
      max_range: 15.0                 # [m] rays longer than this only clear free space
    # Pass-through limits, applied in frame_id (map, z up) after the tf transform.
    # Dropping points below 0.3 m keeps the ground out of the map: the planner flies
    # at bounds.min z = 0.5 m and above.
    point_cloud_min_z: 0.3
    point_cloud_max_z: 6.0
    filter_speckles: true
