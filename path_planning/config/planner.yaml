path_planning:
  ros__parameters:
    map_frame: map
    # World convention of map_frame (z-up). Must match whoever publishes map -> base_link:
    #   nwu: x=North, y=West (what the drone_pose package publishes, default)
    #   enu: x=East,  y=North (REP-103 / px4_ros_com frame_transforms)
    frame_convention: nwu

    robot:
      size: [0.90, 0.90, 0.60]        # collision box X-Y-Z [m]: x500 is ~0.55 m wide, +~0.17 m margin per side
      planning_margin: 0.15           # [m] per side: plan with a larger box than the path check uses

    mapping:                          # Bonxai occupancy map built in this node from topics.cloud
      resolution: 0.20                # [m] voxel edge
      max_range: 15.0                 # [m] rays longer than this only clear free space
      # Points outside [min_z, max_z] in map_frame are dropped before ray casting. 0.3 m keeps
      # the ground out of the map: the planner flies at bounds.min z = 0.5 m and above.
      min_z: 0.3
      max_z: 6.0
      sensor_model:                   # same defaults as octomap_server
        hit: 0.7
        miss: 0.4
        min: 0.12
        max: 0.97
      exact_rays: true                # false: Bresenham rays, ~20 % faster, slightly coarser
      publish_rate_hz: 2.0            # ~/occupied_voxels markers for RViz (0 = off)

    bounds:                           # planning volume in map_frame [m]
      min: [-20.0, -20.0, 0.5]
      max: [20.0, 20.0, 4.0]

    # Two levels: a global A* route over the whole planning volume, then Informed-RRT* (the
    # "planner" section) plans the flyable path along the first local.horizon metres of it,
    # inside a window around that part of the route. The next segment is planned while the
    # drone is still flying the current one.
    global:
      enabled: true                   # false: Informed-RRT* plans all the way to the goal
      resolution: 0.4                 # [m] A* lattice step; keep it <= the robot box size
      snap_radius: 1.2                # [m] an invalid start / goal is moved this far at most
      max_expansions: 500000

    local:
      horizon: 10.0                   # [m] along the route: where each local segment ends
      window_margin: 2.0              # [m] RRT* bounds = that part of the route +- this (x, y)
      replan_distance: 5.0            # [m] plan the next segment (from this one's end) when this much is left
      direct_if_visible: true         # straight line, no RRT* solve, when the local goal is in sight

    planner:                          # local Informed-RRT*
      solve_time: 0.5                 # [s], Informed-RRT* is anytime: uses the whole budget
      range: 4.0                      # max edge length [m]
      k_nearest: false
      # path_length | path_length_cost_to_go | threshold | balanced (length + clearance, uses RRT*)
      objective: path_length_cost_to_go
      cost_threshold: 10.0            # used by "threshold"
      length_weight: 10.0             # used by "balanced"
      clearance_weight: 1.0           # used by "balanced"
      collision_check_resolution: 0.1 # [m]
      waypoint_spacing: 1.0           # [m] path is re-interpolated to this spacing (0 = off)
      smooth: true                    # B-spline smoothing (kept only if collision free)
      max_attempts: 3                 # failed plans are retried with twice the solve time

    control:
      rate_hz: 20.0                   # offboard heartbeat + setpoint rate (PX4 needs > 2 Hz)
      replan_check_rate_hz: 2.0
      acceptance_radius: 0.3          # [m]
      takeoff_altitude: 2.0           # [m] above the arming position
      default_goal_altitude: 2.0      # [m] used when the goal z is below bounds.min (RViz 2D goal)
      # Path following: a reference moves along the path with bounded acceleration and PX4 gets
      # position + velocity feed-forward, so the drone flies through waypoints without stopping.
      max_speed: 1.5                  # [m/s]
      max_accel: 1.0                  # [m/s^2] along the path (braking uses up to 2x)
      max_lateral_accel: 1.0          # [m/s^2] sets the corner speeds
      max_jerk: 2.0                   # [m/s^3] smooths the start and end of accelerations
      max_yaw_rate: 1.0               # [rad/s] yaw follows the path tangent
      tracking_lag_soft: 1.0          # [m] reference slows down above this distance from the drone
      tracking_lag_max: 2.0           # [m] ... and waits for the drone at this distance
      stop_margin: 0.5                # [m] stop this far before a newly blocked path section
      auto_arm: false                 # true: node switches to OFFBOARD and arms by itself (SITL)
      reset_map_on_takeoff: true      # forget what the lidar saw on the ground

    px4:
      target_system: 1
      target_component: 1

    topics:
      vehicle_odometry: /fmu/out/vehicle_odometry
      vehicle_status: /fmu/out/vehicle_status      # PX4 main + Zenoh: no _vN suffix; uXRCE-DDS may add one, check `ros2 topic list`
      offboard_control_mode: /fmu/in/offboard_control_mode
      trajectory_setpoint: /fmu/in/trajectory_setpoint
      vehicle_command: /fmu/in/vehicle_command
      cloud: /lidar/points                         # PointCloud2, any frame with a tf to map_frame
      goal: /goal_pose                             # RViz2 "2D Goal Pose"
